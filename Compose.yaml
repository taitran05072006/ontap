services:
  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile
    container_name: taitran-backend
    ports:
      - "8080:8080"

    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=ontap
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taitran-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: taitran-mysql

    environment:
      - MYSQL_DATABASE=ontap
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=secret
    volumes:
      - mysql-data:/var/lib/mysql

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:stable
    container_name: taitran-nginx
    ports:
      - "8085:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  mysql-data: