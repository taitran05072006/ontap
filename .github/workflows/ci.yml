
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Test backend and build frontend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ontap
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test backend
        working-directory: demo
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ontap
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: ./mvnw -B test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ==========================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGES
  # ==========================================
  publish:
    name: Publish Docker images
    needs: test
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./demo
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ github.sha }}

  # ==========================================
  # JOB 3: DEPLOY TO UBUNTU VM
  # ==========================================
  deploy:
    name: Deploy to Ubuntu backend cluster
    needs: publish
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Check Tailscale and SSH connectivity
        shell: bash
        run: |
          failed=0
          for host in 100.107.7.37 100.104.31.2; do
            echo "Checking Tailscale ping to $host"
            if ping_output=$(sudo tailscale ping --c=3 "$host" 2>&1); then
              printf '%s\n' "$ping_output"
            else
              printf '%s\n' "$ping_output"
              echo "Tailscale ping failed for $host; checking TCP 22 separately"
            fi

            echo "Checking SSH TCP port 22 on $host"
            if python - "$host" <<'PY'
          import socket
          import sys

          host = sys.argv[1]
          try:
              with socket.create_connection((host, 22), timeout=5):
                  print(f"TCP {host}:22 is reachable")
          except OSError as error:
              print(f"TCP {host}:22 failed: {error}", file=sys.stderr)
              sys.exit(1)
          PY
            then
              :
            else
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Configure SSH and Vault credentials
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -eu
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          printf '%s' "$VAULT_PASSWORD" > "$RUNNER_TEMP/vault_password"
          chmod 600 "$RUNNER_TEMP/vault_password"
          cat > "$RUNNER_TEMP/ssh_askpass" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF
          chmod 700 "$RUNNER_TEMP/ssh_askpass"
          eval "$(ssh-agent -s)"
          SSH_ASKPASS="$RUNNER_TEMP/ssh_askpass" \
          SSH_ASKPASS_REQUIRE=force \
          DISPLAY=:0 \
            ssh-add "$RUNNER_TEMP/deploy_key" </dev/null

      - name: Deploy both backend nodes with Ansible
        env:
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ansible-playbook ansible/playbooks/deploy.yml \
            -i ansible/inventory/hosts.yml \
            --vault-password-file "$RUNNER_TEMP/vault_password" \
            -e "ansible_ssh_private_key_file=$RUNNER_TEMP/deploy_key" \
            -e "app_repo_version=${{ github.sha }}" \
            -e "image_tag=${{ github.sha }}" \
            -e "app_db_password=$APP_DB_PASSWORD"

      - name: Verify load balancer
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 http://100.107.7.37/
