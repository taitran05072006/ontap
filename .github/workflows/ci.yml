name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Test backend and build frontend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ontap
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test backend
        working-directory: demo
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ontap
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: ./mvnw -B test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  publish:
    name: Publish Docker images
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./demo
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taitran-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taitran-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taitran-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taitran-frontend:${{ github.sha }}

  deploy:
    name: Deploy Docker images to Ubuntu VM
    needs: publish
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script_stop: true
          script: |
            set -eu
            cd /opt/ontap
            git fetch --depth=1 origin "${{ github.sha }}"
            mkdir -p nginx
            git show FETCH_HEAD:Compose.yaml > Compose.yaml
            git show FETCH_HEAD:nginx/nginx.conf > nginx/nginx.conf
            export IMAGE_TAG="${{ github.sha }}"
            export BACKEND_PULL_POLICY=missing
            export FRONTEND_PULL_POLICY=missing
            docker compose --env-file .env -f Compose.yaml pull --policy always
            docker compose --env-file .env -f Compose.yaml up --detach --remove-orphans --pull never --no-build
            for attempt in $(seq 1 24); do
              if curl --fail --silent --show-error http://127.0.0.1:8085/ >/dev/null; then
                echo "Deployment successful"
                exit 0
              fi
              sleep 5
            done
            docker compose --env-file .env -f Compose.yaml ps
            docker compose --env-file .env -f Compose.yaml logs --tail=100
            exit 1
