---
- name: Install Tailscale when it is not present
  ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
  args:
    creates: /usr/bin/tailscale

- name: Enable and start the Tailscale daemon
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check whether this VM is already connected to Tailscale
  ansible.builtin.command: tailscale ip -4
  register: tailscale_current_ip
  changed_when: false
  failed_when: false

- name: Connect this VM to the tailnet
  ansible.builtin.shell: tailscale up --auth-key="$TS_AUTH_KEY" --hostname={{ tailscale_hostname | quote }} --tags=tag:ci
  environment:
    TS_AUTH_KEY: "{{ tailscale_auth_key }}"
  when:
    - tailscale_current_ip.rc != 0
    - tailscale_auth_key | length > 0
  changed_when: true
  no_log: true

- name: Explain how to finish Tailscale login when no auth key was supplied
  ansible.builtin.debug:
    msg: >-
      Tailscale is installed, but this VM is not logged in. Put a Tailscale auth
      key in the encrypted inventory/group_vars/all/vault.yml file and rerun this playbook.
  when:
    - tailscale_current_ip.rc != 0
    - tailscale_auth_key | length == 0
