---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Allow required TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_allowed_tcp_ports }}"

- name: Allow private application traffic
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: tcp
    from_ip: "{{ item.from_ip }}"
  loop: "{{ firewall_allowed_tcp_rules }}"

- name: Enable UFW with deny-by-default policy
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
