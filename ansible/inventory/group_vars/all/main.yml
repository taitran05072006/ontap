---
timezone: Asia/Ho_Chi_Minh

app_dir: /apt/baitaplon
backend_image: taitran05072006/backend
frontend_image: taitran05072006/frontend
image_tag: latest
database_host: "{{ hostvars['ontap-ubuntu-1']['ansible_host'] }}"
database_port: 3306
frontend_host: "{{ hostvars['ontap-ubuntu-1']['ansible_host'] }}"
backend_port: 8080

backend_nodes:
  - name: backend_1
    address: "{{ hostvars['ontap-ubuntu-1']['ansible_host'] }}"
    port: 8080
  - name: backend_2
    address: "{{ hostvars['ontap-ubuntu-2']['ansible_host'] }}"
    port: 8080

firewall_allowed_tcp_rules:
  - port: 8080
    from_ip: "{{ hostvars['ontap-ubuntu-1']['ansible_host'] }}"
  - port: 8080
    from_ip: "{{ hostvars['ontap-ubuntu-2']['ansible_host'] }}"
  - port: 3306
    from_ip: "{{ hostvars['ontap-ubuntu-1']['ansible_host'] }}"
  - port: 3306
    from_ip: "{{ hostvars['ontap-ubuntu-2']['ansible_host'] }}"

# Set this in the encrypted inventory/group_vars/all/vault.yml file before deploy.yml.
app_db_password: ""

common_packages:
  - ca-certificates
  - curl
  - htop
  - jq
  - unzip
  - vim
