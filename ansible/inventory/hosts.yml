all:
  children:
    app:
      hosts:
        ontap-ubuntu-1:
          ansible_host: "{{ primary_host | default('192.168.64.4', true) }}"
          ansible_user: "{{ deploy_user | default('taitran', true) }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/ubuntunew"
          node_role: primary
        ontap-ubuntu-2:
          ansible_host: "{{ secondary_host | default('192.168.64.7', true) }}"
          ansible_user: "{{ deploy_user | default('taitran', true) }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/ubuntunew"
          node_role: secondary
    load_balancer:
      hosts:
        ontap-ubuntu-1:
    backend:
      hosts:
        ontap-ubuntu-1:
        ontap-ubuntu-2:
    database:
      hosts:
        ontap-ubuntu-1:
