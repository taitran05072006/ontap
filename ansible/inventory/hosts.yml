all:
  children:
    app:
      hosts:
        ontap-ubuntu-1:
          ansible_host: "{{ primary_host | default('100.107.7.37', true) }}"
          ansible_user: taitran
          ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/ubuntu"
          node_role: primary
        ontap-ubuntu-2:
          ansible_host: "{{ secondary_host | default('100.104.31.2', true) }}"
          ansible_user: trangiatai
          ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/ubuntu"
          node_role: secondary
    load_balancer:
      hosts:
        ontap-ubuntu-1:
    backend:
      hosts:
        ontap-ubuntu-1:
        ontap-ubuntu-2:
    database:
      hosts:
        ontap-ubuntu-1:
